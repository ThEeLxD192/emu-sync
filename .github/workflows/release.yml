name: Publish Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Tipo de versión (SemVer)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Bump Version, Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump Version
        id: bump
        run: |
          chmod +x scripts/bump-version.sh
          ./scripts/bump-version.sh "${{ github.event.inputs.release_type }}"

      - name: Commit & Push New Version and Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/main/kotlin/com/emusync/AppInfo.kt build.gradle.kts
          git commit -m "chore(release): ${{ steps.bump.outputs.tag_name }}"
          git push origin main
          git tag "${{ steps.bump.outputs.tag_name }}"
          git push origin "${{ steps.bump.outputs.tag_name }}"

      - name: Build AppImage via Docker
        run: |
          docker compose build
          docker compose run --rm build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag_name }}
          name: "EmuSync ${{ steps.bump.outputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            EmuSync-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmuSync-${{ steps.bump.outputs.new_version }}-x86_64
          path: EmuSync-x86_64.AppImage
          retention-days: 90

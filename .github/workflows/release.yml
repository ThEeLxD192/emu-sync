name: Publish Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release version type (SemVer)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  prepare-version:
    name: Prepare Release Version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      tag_name: ${{ steps.bump.outputs.tag_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Bump Version
        id: bump
        run: |
          chmod +x scripts/bump-version.sh
          ./scripts/bump-version.sh "${{ github.event.inputs.release_type }}"

  build-linux:
    name: Build Linux AppImage
    needs: prepare-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Apply Candidate Version
        run: |
          chmod +x scripts/bump-version.sh
          ./scripts/bump-version.sh "${{ github.event.inputs.release_type }}"

      - name: Build AppImage via Docker
        run: |
          docker compose build
          docker compose run --rm build

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: EmuSync-${{ needs.prepare-version.outputs.new_version }}-x86_64-linux
          path: EmuSync-x86_64.AppImage
          retention-days: 90

  build-windows:
    name: Build Windows MSI & EXE
    needs: prepare-version
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Apply Candidate Version
        shell: bash
        run: |
          chmod +x scripts/bump-version.sh
          ./scripts/bump-version.sh "${{ github.event.inputs.release_type }}"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build Windows Installers (MSI & EXE)
        run: ./gradlew packageReleaseMsi packageReleaseExe --no-daemon

      - name: Prepare Windows Distribution Files
        shell: bash
        run: |
          mkdir -p dist
          MSI_FILE=$(find build/compose/binaries -type f -name "*.msi" | head -n 1)
          EXE_FILE=$(find build/compose/binaries -type f -name "*.exe" | head -n 1)
          if [ -z "$MSI_FILE" ] || [ -z "$EXE_FILE" ]; then
            echo "Error: MSI or EXE binary not found under build/compose/binaries"
            find build/compose/binaries -type f || true
            exit 1
          fi
          echo "Found MSI: $MSI_FILE"
          echo "Found EXE: $EXE_FILE"
          cp "$MSI_FILE" dist/EmuSync-x86_64.msi
          cp "$EXE_FILE" dist/EmuSync-x86_64.exe

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: EmuSync-${{ needs.prepare-version.outputs.new_version }}-x86_64-windows
          path: dist/*
          retention-days: 90

  create-release:
    name: Create GitHub Release
    needs: [prepare-version, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Validated Candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux Artifact
        uses: actions/download-artifact@v7
        with:
          name: EmuSync-${{ needs.prepare-version.outputs.new_version }}-x86_64-linux
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v7
        with:
          name: EmuSync-${{ needs.prepare-version.outputs.new_version }}-x86_64-windows
          path: release-assets

      - name: Publish Version Commit and Tag
        id: publish
        env:
          RELEASE_TAG: ${{ needs.prepare-version.outputs.tag_name }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            release_commit=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
            release_parent=$(git rev-parse "${release_commit}^")
            if [[ "$release_parent" != "$GITHUB_SHA" ]]; then
              echo "Existing tag ${RELEASE_TAG} does not belong to this release candidate." >&2
              exit 1
            fi
            echo "Found the version commit and tag from a previous run; continuing with release creation."
          else
            chmod +x scripts/bump-version.sh
            ./scripts/bump-version.sh "${{ github.event.inputs.release_type }}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/main/kotlin/com/emusync/AppInfo.kt build.gradle.kts
            git commit -m "chore(release): ${RELEASE_TAG}"
            git tag "${RELEASE_TAG}"
            git push --atomic origin HEAD:main "refs/tags/${RELEASE_TAG}"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-version.outputs.tag_name }}
          name: "EmuSync ${{ needs.prepare-version.outputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Test & Build Check (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon

      - name: Verify Linux Packaging (AppImage)
        if: matrix.platform == 'Linux'
        run: ./gradlew packageReleaseAppImage --no-daemon

      - name: Verify Windows Packaging (MSI & EXE)
        if: matrix.platform == 'Windows'
        run: ./gradlew packageReleaseMsi packageReleaseExe --no-daemon

name: CI Validation

on:
  push:
    branches: [ main, develop, rewrite/rust-native ]
  pull_request:

jobs:
  validate:
    name: Test & Build Check (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Verify coordinated version bumps
        shell: bash
        run: bash scripts/tests/bump-version-test.sh

      - name: Verify AppImage library selection
        if: matrix.platform == 'Linux'
        shell: bash
        run: bash scripts/tests/appimage-fallback-test.sh

      - name: Check Rust architecture, quality and tests
        shell: bash
        run: |
          set -o pipefail
          cargo xtask check 2>&1 | tee rust-check.log

      - name: Check Quality and Run Unit Tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export EMUSYNC_BASH="$(cygpath -w "$BASH")"
          else
            export EMUSYNC_BASH="$BASH"
          fi
          ./gradlew check --no-daemon

      - name: Upload Quality and Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.platform }}
          path: |
            rust-check.log
            **/build/test-results/
            **/build/reports/tests/
            **/build/reports/detekt/
            **/build/reports/plugin-development/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Linux Packaging (AppImage)
        if: matrix.platform == 'Linux'
        run: ./gradlew packageReleaseAppImage --no-daemon

      - name: Verify Windows Packaging (MSI & EXE)
        if: matrix.platform == 'Windows'
        run: ./gradlew packageReleaseMsi packageReleaseExe --no-daemon --info

      - name: Print jpackage diagnostic logs on failure
        if: failure() && matrix.platform == 'Windows'
        shell: bash
        run: |
          find desktopApp/build/compose/logs -type f -exec echo "=== {} ===" \; -exec cat {} \; || true

name: CI Validation

on:
  push:
    branches: [ main, develop, rewrite/rust-native ]
  pull_request:

jobs:
  validate:
    name: Test & Build Check (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Verify coordinated version bumps
        shell: bash
        run: bash scripts/tests/bump-version-test.sh

      - name: Verify pre-commit hook
        shell: bash
        run: bash scripts/tests/git-hooks-test.sh

      - name: Verify AppImage library selection
        if: matrix.platform == 'Linux'
        shell: bash
        run: bash scripts/tests/appimage-fallback-test.sh

      - name: Check Rust architecture, quality and tests
        shell: bash
        run: |
          set -o pipefail
          cargo xtask check 2>&1 | tee rust-check.log

      - name: Upload Quality and Test Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.platform }}
          path: rust-check.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Linux Packaging (AppImage)
        if: matrix.platform == 'Linux'
        shell: bash
        run: bash scripts/build-appimage-container.sh "$RUNNER_TEMP/EmuSync-x86_64.AppImage"

  windows-exe:
    # Test build for manual validation on a real Windows machine or VM. It is never
    # published as a release, and it runs beside `validate` so it does not slow it down.
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Build release executable
        shell: bash
        run: cargo build --release --locked -p emusync-desktop-app

      - name: Verify executable properties
        shell: pwsh
        run: |
          $exe = "target/release/emusync-desktop-app.exe"
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductName -ne "EmuSync") { throw "ProductName is '$($info.ProductName)', expected EmuSync" }
          if (-not $info.FileVersion) { throw "the executable has no file version" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          # Subsystem sits 68 bytes into the optional header, after the 4-byte signature and the
          # 20-byte COFF header: 2 is a GUI application, 3 would open a console window.
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
          if ($subsystem -ne 2) { throw "expected the GUI subsystem (2), found $subsystem" }
          if ([System.Text.Encoding]::ASCII.GetString($bytes) -match "VCRUNTIME140") {
            throw "the executable depends on the dynamic Visual C++ runtime"
          }
          Write-Host "Version $($info.FileVersion), GUI subsystem, static C runtime"

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: EmuSync-windows-x86_64-exe-${{ github.sha }}
          path: target/release/emusync-desktop-app.exe
          if-no-files-found: error
          retention-days: 7

  windows-installers:
    # Builds the MSI and the portable ZIP, then installs, upgrades from the last Kotlin
    # release (same UpgradeCode), reinstalls and removes the MSI on the runner and checks each
    # step. The runner is a disposable machine, so touching Program Files is safe here.
    name: Build and verify Windows installers
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Install WiX 4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g WixToolset.UI.wixext/4.0.5

      - name: Build the installers
        shell: bash
        run: |
          mkdir -p dist
          bash scripts/build-windows-installers.sh dist

      - name: Download the last Kotlin release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh release download v1.2.1 --repo "$GITHUB_REPOSITORY" --pattern EmuSync-x86_64.msi --dir previous

      - name: Install, upgrade, reinstall and uninstall
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          ./scripts/verify-windows-installers.ps1 `
            -Msi (Resolve-Path dist/EmuSync-x86_64.msi).Path `
            -Zip (Resolve-Path dist/EmuSync-x86_64-portable.zip).Path `
            -PreviousMsi (Resolve-Path previous/EmuSync-x86_64.msi).Path `
            -Version $version

      - name: Upload installer logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-logs-${{ github.sha }}
          path: installer-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: EmuSync-windows-installers-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

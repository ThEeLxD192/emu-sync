name: CI Validation

on:
  push:
    branches: [ main, develop, rewrite/rust-native ]
  pull_request:

permissions:
  contents: read

jobs:
  # Formatting, architecture rules and Clippy. It runs on both platforms because Clippy only
  # sees the `cfg(windows)` code when it runs on Windows.
  quality:
    name: Quality (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      # Dependencies are restored from the cache; only pushes to main refresh it, so pull
      # requests never evict it.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify coordinated version bumps
        shell: bash
        run: bash scripts/tests/bump-version-test.sh

      - name: Verify pre-commit hook
        shell: bash
        run: bash scripts/tests/git-hooks-test.sh

      - name: Verify AppImage library selection
        if: matrix.platform == 'Linux'
        shell: bash
        run: bash scripts/tests/appimage-fallback-test.sh

      - name: Check Rust architecture and quality
        shell: bash
        run: |
          set -o pipefail
          cargo xtask quality 2>&1 | tee rust-quality.log

      - name: Upload Quality Log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports-${{ matrix.platform }}
          path: rust-quality.log
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: Tests (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.99.1

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Rust tests
        shell: bash
        run: |
          set -o pipefail
          cargo xtask test 2>&1 | tee rust-tests.log

      - name: Upload Test Log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.platform }}
          path: rust-tests.log
          if-no-files-found: ignore
          retention-days: 7

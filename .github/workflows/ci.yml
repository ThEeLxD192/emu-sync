name: CI Validation

on:
  push:
    branches: [ main, develop, rewrite/rust-native ]
  pull_request:

jobs:
  validate:
    name: Test & Build Check (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Verify coordinated version bumps
        shell: bash
        run: bash scripts/tests/bump-version-test.sh

      - name: Verify pre-commit hook
        shell: bash
        run: bash scripts/tests/git-hooks-test.sh

      - name: Verify AppImage library selection
        if: matrix.platform == 'Linux'
        shell: bash
        run: bash scripts/tests/appimage-fallback-test.sh

      - name: Check Rust architecture, quality and tests
        shell: bash
        run: |
          set -o pipefail
          cargo xtask check 2>&1 | tee rust-check.log

      - name: Upload Quality and Test Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.platform }}
          path: rust-check.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify Linux Packaging (AppImage)
        if: matrix.platform == 'Linux'
        shell: bash
        run: bash scripts/build-appimage-container.sh "$RUNNER_TEMP/EmuSync-x86_64.AppImage"

  windows-exe:
    # Test build for manual validation on a real Windows machine or VM. It is never
    # published as a release, and it runs beside `validate` so it does not slow it down.
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Build release executable
        shell: bash
        run: cargo build --release --locked -p emusync-desktop-app

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: EmuSync-windows-x86_64-exe-${{ github.sha }}
          path: target/release/emusync-desktop-app.exe
          if-no-files-found: error
          retention-days: 7

[workspace]
resolver = "3"
members = ["rust/*", "xtask"]

[workspace.package]
version = "2.2.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"

# Every crate takes its versions from here and adds only the features it needs.
[workspace.dependencies]
emusync-application = { path = "rust/application" }
emusync-data-drive = { path = "rust/data-drive" }
emusync-data-local = { path = "rust/data-local" }
emusync-data-updates = { path = "rust/data-updates" }
emusync-domain = { path = "rust/domain" }
emusync-platform-desktop = { path = "rust/platform-desktop" }
emusync-presentation = { path = "rust/presentation" }

base64 = "0.22"
bytes = "1"
cargo_metadata = "0.23.1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", features = ["winit", "wayland", "x11"] }
egui-winit = "0.37.0"
filetime = "0.2.29"
futures-util = "0.3"
getrandom = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
indexmap = "2.14.2"
pollster = "0.4"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rfd = { version = "0.18", default-features = false }
ring = "0.17"
rustix = "1.1.6"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = "0.6.5"
subtle = "2"
tempfile = "3.27.0"
time = "0.3.55"
tokio = "1.54.1"
tokio-util = "0.7"
windows-sys = "0.61.2"
winit = "0.30.13"
winresource = "0.1.34"

# `unsafe` only where a platform API has no safe wrapper, each site with its reason.
[workspace.lints.rust]
unsafe_code = "deny"

# Debug builds keep file and line for backtraces but skip full debug info: it is the bulk of
# the linker input for the many test binaries and nobody steps through dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# What users run. Whole-program optimization makes each UI frame about 17% cheaper and the
# binary a third smaller, for about 15% longer clean release builds (`cargo xtask perf`
# and the Criterion benches measure both). Symbols are stripped: panics still report file
# and line. Panics must keep unwinding: the supervisor and the runtime owner catch them.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

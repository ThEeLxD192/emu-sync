[workspace]
resolver = "3"
members = ["rust/*", "xtask"]

[workspace.package]
version = "2.1.2"
edition = "2024"
rust-version = "1.99"
license = "MIT"

# Debug builds keep file and line for backtraces but skip full debug info: it is the bulk of
# the linker input for the many test binaries and nobody steps through dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# What users run. Whole-program optimization makes each UI frame about 17% cheaper and the
# binary a third smaller, for about 15% longer clean release builds (`cargo xtask perf`
# and the Criterion benches measure both). Symbols are stripped: panics still report file
# and line. Panics must keep unwinding: the supervisor and the runtime owner catch them.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmuSync — Error</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a0a0a 0%, #2d1515 40%, #1a0f0f 100%);
            overflow: hidden;
        }
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            animation: float 8s ease-in-out infinite;
        }
        .orb-1 { width: 400px; height: 400px; background: #ef4444; top: -100px; left: -100px; }
        .orb-2 { width: 300px; height: 300px; background: #f97316; bottom: -80px; right: -80px; animation-delay: -4s; }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }
        .card {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 3rem 3.5rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            max-width: 440px;
            width: 90vw;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .icon-wrap {
            width: 80px; height: 80px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.3);
            animation: pop 0.5s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes pop {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        .x-mark {
            width: 36px; height: 36px;
            stroke: white; stroke-width: 3;
            fill: none; stroke-linecap: round;
            stroke-dasharray: 50; stroke-dashoffset: 50;
            animation: draw 0.4s 0.6s ease forwards;
        }
        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fca5a5;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }
        .brand {
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(252, 165, 165, 0.6);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="card">
        <div class="icon-wrap">
            <svg class="x-mark" viewBox="0 0 36 36">
                <line x1="10" y1="10" x2="26" y2="26"/>
                <line x1="26" y1="10" x2="10" y2="26"/>
            </svg>
        </div>
        <h1>Authorization Failed</h1>
        <p class="subtitle">Something went wrong.<br>Please close this tab and try again from EmuSync.</p>
        <div class="brand">🎮 EmuSync</div>
    </div>
</body>
</html>

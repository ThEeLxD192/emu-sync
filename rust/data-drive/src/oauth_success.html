<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmuSync — Authorized</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 40%, #24243e 100%);
            overflow: hidden;
        }
        /* Animated background orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 8s ease-in-out infinite;
        }
        .orb-1 { width: 400px; height: 400px; background: #6c63ff; top: -100px; left: -100px; }
        .orb-2 { width: 300px; height: 300px; background: #00d2ff; bottom: -80px; right: -80px; animation-delay: -4s; }
        .orb-3 { width: 200px; height: 200px; background: #a78bfa; top: 50%; left: 60%; animation-delay: -2s; }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }
        .card {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 3rem 3.5rem;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.08);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            max-width: 440px;
            width: 90vw;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .icon-wrap {
            width: 80px; height: 80px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.3);
            animation: pop 0.5s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes pop {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
        .checkmark {
            width: 40px; height: 40px;
            stroke: white; stroke-width: 3;
            fill: none; stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 60; stroke-dashoffset: 60;
            animation: draw 0.5s 0.6s ease forwards;
        }
        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }
        .subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(167, 139, 250, 0.8);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .countdown {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="card">
        <div class="icon-wrap">
            <svg class="checkmark" viewBox="0 0 40 40">
                <polyline points="10,20 18,28 30,12"/>
            </svg>
        </div>
        <h1>Authorization Successful</h1>
        <p class="subtitle">Your Google Drive is connected.<br>You can close this tab and return to EmuSync.</p>
        <div class="brand">🎮 EmuSync</div>
        <p class="countdown" id="cd">This tab will try to close in <strong>5</strong>s</p>
    </div>
    <script>
        let s = 5;
        const el = document.querySelector('#cd strong');
        const t = setInterval(() => {
            s--;
            el.textContent = s;
            if (s <= 0) {
                clearInterval(t);
                window.close();
                setTimeout(() => {
                    if (!window.closed) {
                        document.querySelector('#cd').textContent =
                            'Your browser kept this tab open. Close it manually to return to EmuSync.';
                    }
                }, 250);
            }
        }, 1000);
    </script>
</body>
</html>

[package]
name = "emusync-data-drive"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
emusync-domain.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }

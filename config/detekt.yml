# Formatting is owned by ktfmt. Keep semantic, complexity and naming checks in Detekt.
config:
  validation: true
  warningsAsErrors: true
comments:
  OutdatedDocumentation:
    active: true
complexity:
  CyclomaticComplexMethod:
    allowedComplexity: 14
  LongMethod:
    allowedLines: 60
    ignoreAnnotated: ['Composable']
  NestedBlockDepth:
    allowedDepth: 4
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable', 'Preview']
coroutines:
  GlobalCoroutineUsage:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9]*|[A-Z][_A-Z0-9]*'
style:
  MaxLineLength:
    active: false
  NewLineAtEndOfFile:
    active: false

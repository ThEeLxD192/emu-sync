services:
  # Builds EmuSync-x86_64.AppImage directly in the project root
  build:
    build:
      context: .
      dockerfile: Dockerfile
    image: emu-sync-builder:latest
    volumes:
      # Mount root directory to /out to deposit final AppImage executables
      - .:/out
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./build-logic:/app/build-logic
      - ./gradle:/app/gradle
      - ./settings.gradle.kts:/app/settings.gradle.kts:ro
      - ./build.gradle.kts:/app/build.gradle.kts:ro
      - ./gradle.properties:/app/gradle.properties:ro
      - ./config:/app/config:ro
      - ./domain:/app/domain
      - ./application:/app/application
      - ./data:/app/data
      - ./platform:/app/platform
      - ./presentation:/app/presentation
      - ./desktopApp:/app/desktopApp
      # Mount ./build to persist build reports and local cache
      - ./build:/app/build
      # Persistent Gradle cache for faster incremental builds
      - gradle-cache:/root/.gradle
      # Preserve project state, including configuration cache, across containers
      - gradle-project-cache:/app/.gradle

volumes:
  gradle-cache:
  gradle-project-cache:
